name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      # No Apple Developer account, no certificates — archive with signing off,
      # then fakesign so the IPA installs via TrollStore and sideload tools.
      - name: Archive without code signing
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Hunny.xcodeproj \
            -scheme Hunny \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Hunny.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Fakesign and package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R "build/Hunny.xcarchive/Products/Applications/Hunny.app" build/Payload/Hunny.app
          ldid -S build/Payload/Hunny.app/Hunny
          cd build
          zip -qry Hunny.ipa Payload
          ls -lh Hunny.ipa

      - name: Attach IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hunny-unsigned-ipa
          path: build/Hunny.ipa
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Hunny.ipa \
            --title "Hunny $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Unsigned, fakesigned IPA. Sideload with AltStore, SideStore or Sideloadly (TrollStore can install it directly)."
